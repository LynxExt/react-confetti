colors: true
min_version: 1.7.0

pre-commit:
  parallel: true
  jobs:
    - name: biome-check
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      run: bunx --bun @biomejs/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: ls-lint
      run: bun run lint:files

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --config .config/commitlint.config.ts --edit {1}

pre-push:
  parallel: true
  jobs:
    - name: typecheck
      run: bun run typecheck

    - name: knip
      run: bun run knip
